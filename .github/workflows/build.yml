name: Build Patched APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner cmake ninja-build python3 curl
          curl -L --fail --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          sudo install -m 0644 /tmp/apktool.jar /usr/local/lib/apktool.jar
          sudo tee /usr/local/bin/apktool >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec java -jar /usr/local/lib/apktool.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Verify Original APK
        run: |
          test -f original.apk
          echo "original.apk found:"
          ls -lh original.apk

      - name: Decompile original.apk
        run: |
          apktool d original.apk -o game_out

      - name: Inject System.loadLibrary("netmod") into DGuns5.smali
        run: |
          python3 - <<'PY2'
          import os

          target_file = None

          for root, dirs, files in os.walk("game_out"):
              for f in files:
                  if f == "DGuns5.smali":
                      target_file = os.path.join(root, f)
                      break
              if target_file:
                  break

          if not target_file:
              raise FileNotFoundError(
                  "Critical Error: DGuns5.smali not found in game_out decompiled tree!"
              )

          print(f"Targeting game entry class: {target_file}")

          with open(target_file, "r", encoding="utf-8") as f:
              lines = f.readlines()

          # Find DGuns5 static initializer.
          clinit_start = None
          clinit_end = None

          for i, line in enumerate(lines):
              if ".method" in line and "<clinit>()V" in line:
                  clinit_start = i
                  for j in range(i + 1, len(lines)):
                      if lines[j].strip() == ".end method":
                          clinit_end = j
                          break
                  break

          if clinit_start is None or clinit_end is None:
              raise ValueError(
                  "Failed to locate DGuns5 <clinit>()V static initializer!"
              )

          # Find app_lib string inside <clinit>.
          app_lib_line = None

          for i in range(clinit_start, clinit_end):
              if 'const-string v0, "app_lib"' in lines[i]:
                  app_lib_line = i
                  break

          if app_lib_line is None:
              raise ValueError(
                  "Failed to locate const-string v0, \"app_lib\" inside DGuns5 <clinit>!"
              )

          # Find the following loadLibrary instruction.
          load_line = None

          for i in range(app_lib_line + 1, min(app_lib_line + 15, clinit_end)):
              if "Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V" in lines[i]:
                  load_line = i
                  break

          if load_line is None:
              raise ValueError(
                  "Found app_lib but failed to locate its following loadLibrary instruction!"
              )

          # Prevent duplicate injection.
          if any(
              'const-string v0, "netmod"' in lines[i]
              for i in range(clinit_start, clinit_end)
          ):
              print('netmod loader already present; leaving file unchanged.')
          else:
              injection = [
                  '    const-string v0, "netmod"\n',
                  '    invoke-static {v0}, '
                  'Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n'
              ]

              lines[load_line + 1:load_line + 1] = injection

              with open(target_file, "w", encoding="utf-8") as f:
                  f.writelines(lines)

              print(
                  'Successfully injected loadLibrary("netmod") '
                  "immediately after app_lib load."
              )

          print("Verified: DGuns5.smali netmod loader handling complete.")
          PY2

      - name: Build Native Library (libnetmod.so)
        run: |
          cmake -B build -G Ninja             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Force extractNativeLibs=true in AndroidManifest.xml
        run: |
          python3 - <<'PY'
          path = "game_out/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if 'android:extractNativeLibs="false"' in content:
              content = content.replace(
                  'android:extractNativeLibs="false"',
                  'android:extractNativeLibs="true"'
              )
          elif 'android:extractNativeLibs="true"' not in content:
              if "<application " in content:
                  content = content.replace(
                      "<application ",
                      '<application android:extractNativeLibs="true" ',
                      1
                  )
              elif "<application>" in content:
                  content = content.replace(
                      "<application>",
                      '<application android:extractNativeLibs="true">',
                      1
                  )
              else:
                  raise SystemExit("Could not find <application> tag in AndroidManifest.xml")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          if 'android:extractNativeLibs="true"' not in content:
              raise SystemExit("Failed to set android:extractNativeLibs=true")

          print("Confirmed: android:extractNativeLibs=true")
          PY

      - name: Inject Shared Library & Rebuild APK
        run: |
          mkdir -p game_out/lib/arm64-v8a/
          cp build/libnetmod.so game_out/lib/arm64-v8a/
          apktool b game_out -o patched.apk

      - name: Align and Sign APK
        run: |
          zipalign -v -f 4 patched.apk patched_aligned.apk
          keytool -genkey -v -keystore test.jks -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Test"
          apksigner sign             --ks test.jks             --ks-pass pass:123456             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out patched_signed.apk             patched_aligned.apk
          echo "Verifying final APK signature..."
          apksigner verify --verbose --print-certs patched_signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DGuns5-Patched-APK
          path: patched_signed.apk
