name: Build Patched APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner cmake ninja-build python3 curl
          curl -L --fail --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          sudo install -m 0644 /tmp/apktool.jar /usr/local/lib/apktool.jar
          sudo tee /usr/local/bin/apktool >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec java -jar /usr/local/lib/apktool.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Verify Original APK
        run: |
          test -f original.apk
          echo "original.apk found:"
          ls -lh original.apk

      - name: Decompile original.apk
        run: |
          apktool d original.apk -o game_out

      - name: Inject System.loadLibrary("netmod") into Smali
        run: |
          python3 - <<'PY'
          import glob
          import re

          smali_files = glob.glob("game_out/smali*/**/*.smali", recursive=True)
          candidates = []

          for f in smali_files:
              with open(f, "r", encoding="utf-8", errors="ignore") as fh:
                  content = fh.read()
              if ".method" in content and (
                  "Landroid/app/Activity;" in content
                  or "onCreate(Landroid/os/Bundle;)V" in content
              ):
                  candidates.append(f)

          target_file = candidates[0] if candidates else (smali_files[0] if smali_files else None)
          if not target_file:
              raise SystemExit("No Smali files found after apktool decompilation")

          print(f"Injecting loadLibrary into: {target_file}")

          with open(target_file, "r", encoding="utf-8") as fh:
              lines = fh.readlines()

          if 'System;->loadLibrary(Ljava/lang/String;)V' in ''.join(lines):
              print("netmod loadLibrary already present; leaving file unchanged")
              raise SystemExit(0)

          start = None
          end = None
          for i, line in enumerate(lines):
              if re.match(r'^\.method\s+(?:public\s+|private\s+|protected\s+|static\s+|final\s+|synthetic\s+)*<clinit>\(\)V', line):
                  start = i
                  for j in range(i + 1, len(lines)):
                      if lines[j].startswith(".end method"):
                          end = j
                          break
                  break

          if start is not None and end is not None:
              block = lines[start:end]
              registers_idx = next((k for k, x in enumerate(block) if x.strip().startswith(".registers ")), None)
              locals_idx = next((k for k, x in enumerate(block) if x.strip().startswith(".locals ")), None)

              if registers_idx is not None:
                  m = re.search(r'\.registers\s+(\d+)', block[registers_idx])
                  if m:
                      n = int(m.group(1))
                      block[registers_idx] = block[registers_idx].replace(str(n), str(max(n, 1)), 1)
              elif locals_idx is not None:
                  m = re.search(r'\.locals\s+(\d+)', block[locals_idx])
                  if m:
                      n = int(m.group(1))
                      block[locals_idx] = block[locals_idx].replace(str(n), str(max(n, 1)), 1)

              insert_at = len(block)
              while insert_at > 0 and block[insert_at-1].strip() in ("", ".end method"):
                  insert_at -= 1
              block.insert(insert_at, '    const-string v0, "netmod"\n')
              block.insert(insert_at + 1, '    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n')
              lines[start:end] = block
          else:
              first_method = next((i for i, x in enumerate(lines) if x.startswith(".method ")), len(lines))
              init = [
                  ".method static constructor <clinit>()V\n",
                  "    .locals 1\n",
                  '    const-string v0, "netmod"\n',
                  '    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n',
                  "    return-void\n",
                  ".end method\n",
                  "\n"
              ]
              lines[first_method:first_method] = init

          with open(target_file, "w", encoding="utf-8") as fh:
              fh.writelines(lines)

          print("Smali injection complete")
          PY

      - name: Build Native Library (libnetmod.so)
        run: |
          cmake -B build -G Ninja             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Inject Shared Library & Rebuild APK
        run: |
          mkdir -p game_out/lib/arm64-v8a/
          cp build/libnetmod.so game_out/lib/arm64-v8a/
          apktool b game_out -o patched.apk

      - name: Align and Sign APK
        run: |
          zipalign -v -f 4 patched.apk patched_aligned.apk
          keytool -genkey -v -keystore test.jks -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Test"
          apksigner sign \
            --ks test.jks \
            --ks-pass pass:123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out patched_signed.apk \
            patched_aligned.apk
          echo "Verifying final APK signature..."
          apksigner verify --verbose --print-certs patched_signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DGuns5-Patched-APK
          path: patched_signed.apk
