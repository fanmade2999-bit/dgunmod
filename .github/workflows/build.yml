name: Build Patched APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner cmake ninja-build

      - name: Build Native Library (libnetmod.so)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Inject Shared Library & Rebuild APK
        run: |
          mkdir -p game_out/lib/arm64-v8a/
          cp build/libnetmod.so game_out/lib/arm64-v8a/
          apktool b game_out -o patched.apk

      - name: Align and Sign APK
        run: |
          zipalign -v -f 4 patched.apk patched_aligned.apk
          keytool -genkey -v -keystore test.jks -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Test"
          apksigner sign --ks test.jks --ks-pass pass:123456 --out patched_signed.apk patched_aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DGuns5-Patched-APK
          path: patched_signed.apk
